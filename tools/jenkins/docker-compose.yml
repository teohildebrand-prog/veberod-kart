services:
  jenkins:
    build: .
    image: veberod-jenkins
    # root inside the container, so it can use the host's Docker socket on Linux and Docker Desktop alike
    user: root
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    env_file: .env
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
volumes:
  jenkins_home:
